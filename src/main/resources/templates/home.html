<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <style>
        /* === Global === */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: #ddd;
            font-weight: bold;
            padding: 12px 20px;
            background-color: #444;
            border-radius: 12px;
            transition: background 0.3s, transform 0.2s;
        }

        a:hover {
            background-color: #666;
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome to Public Home Page</h1>
    <a th:href="@{/secure}">Go to Secure Page</a>
</div>
</body>
</html>
