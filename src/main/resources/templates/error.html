<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        /* === Global === */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
        }

        h1 {
            color: #ff4c4c;
            margin-bottom: 20px;
        }

        p {
            font-size: 15px;
            margin-bottom: 25px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #555;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚠ Oops! An error occurred.</h1>
    <p th:text="${message != null ? message : 'An unexpected error occurred.'}"></p>
    <a th:href="@{/employees}" class="btn">⬅ Back to Employee List</a>
</div>
</body>
</html>
