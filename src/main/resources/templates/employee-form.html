<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 500px;
            margin: 60px auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
        }

        input:focus {
            outline: none;
            border-color: #666;
        }

        .error {
            color: #ff4c4c;
            font-size: 13px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: #222;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        .btn-save {
            background-color: #2e8b57;
        }

        .btn-save:hover {
            background-color: #3cb371;
        }

        .btn-back {
            background-color: #444;
        }

        .btn-back:hover {
            background-color: #666;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${employee.id != null} ? 'Edit Employee' : 'Add Employee'"></h1>

    <!-- ✅ Dynamically switch between create and edit endpoints -->
    <form th:action="${employee.id != null} ? @{'/employees/edit/' + ${employee.id}} : @{/employees}"
          th:object="${employee}" method="post">

        <!-- ✅ Always include hidden ID (will be null when adding) -->
        <input type="hidden" th:field="*{id}"/>

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required>
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></div>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" th:field="*{email}" required>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-save">💾 Save</button>
            <a th:href="@{/employees}" class="btn btn-back">← Back</a>
        </div>
    </form>
</div>
</body>
</html>
