<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        /* === Global Styles === */
        body {
          font-family: "Segoe UI", Arial, sans-serif;
          background-color: #121212;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
        }

        /* === Form Container === */
        .container {
          background-color: #1f1f1f;
          padding: 50px 40px;
          border-radius: 20px;
          box-shadow: 0 10px 25px rgba(0,0,0,0.6);
          width: 400px;
          max-width: 90%;
          text-align: center;
        }

        /* === Form Title === */
        .container h2 {
          color: #ffffff;
          margin-bottom: 40px;
          font-size: 26px;
        }

        /* === Labels === */
        .container label {
          display: block;
          text-align: left;
          color: #ddd;
          font-size: 15px;
          margin-bottom: 8px;
        }

        /* === Inputs === */
        .container input[type="text"],
        .container input[type="password"] {
          width: 100%;
          padding: 14px 18px;
          margin-bottom: 25px;
          border: none;
          border-radius: 10px;
          background-color: #2c2c2c;
          color: #f5f5f5;
          font-size: 17px;
          transition: all 0.3s ease;
          box-sizing: border-box;
        }

        .container input:focus {
          outline: none;
          background-color: #3a3a3a;
          box-shadow: 0 0 8px #4caf50;
        }

        /* === Button === */
        .container button {
          width: 100%;
          padding: 14px;
          border: none;
          border-radius: 10px;
          background-color: #4caf50;
          color: #fff;
          font-size: 17px;
          cursor: pointer;
          transition: background-color 0.3s ease;
        }

        .container button:hover {
          background-color: #45a049;
        }

        /* === Messages === */
        .message {
          margin-bottom: 20px;
          padding: 10px;
          border-radius: 8px;
          font-size: 15px;
        }

        .message.error {
          background-color: #b71c1c;
          color: #fff;
        }

        .message.logout {
          background-color: #1b5e20;
          color: #fff;
        }
    </style>

</head>
<body>
<div class="container">
    <h2>Log In</h2>

    <!-- Show error if login fails -->
    <div th:if="${param.error}" class="message error">
        Invalid username or password.
    </div>

    <!-- Show message if user logged out -->
    <div th:if="${param.logout}" class="message logout">
        You have been logged out successfully.
    </div>

    <!-- Login form -->
    <form th:action="@{/login}" method="post">
        <div style="width: 100%;">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required />
        </div>
        <div style="width: 100%;">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Log In</button>
    </form>
</div>
</body>
</html>
