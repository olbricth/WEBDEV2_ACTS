<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        /* === Global === */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #fff;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            text-align: left;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            padding: 12px;
            border-radius: 12px;
            border: none;
            background-color: #333;
            color: #f5f5f5;
            font-size: 15px;
            transition: background-color 0.2s ease;
        }

        input:focus {
            outline: none;
            background-color: #444;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background-color: #444;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #666;
            transform: translateY(-2px);
        }

        p {
            margin-top: 15px;
        }

        a {
            color: #ddd;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: #fff;
        }

        /* ✅ Success message after register */
        .success-message {
            color: #4CAF50;
            margin-top: 10px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Login</h2>

    <form th:action="@{/login}" method="post">
        <div>
            <label>Username:</label>
            <input type="text" name="username" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a th:href="@{/register}">Register here</a>
    </p>

    <!-- ✅ Show success message when redirected after register -->
    <p th:if="${param.registered}" class="success-message">
        ✅ Account created successfully. Please log in.
    </p>
</div>
</body>
</html>
