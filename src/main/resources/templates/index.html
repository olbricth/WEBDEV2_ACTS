<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Car List</title>
    <style>
        /* === Global === */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
        }

        /* Buttons Row */
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn, button {
            display: inline-block;
            padding: 6px 12px; /* smaller padding */
            border-radius: 8px;
            border: none;
            background-color: #444;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-align: center;
        }

        .btn:hover, button:hover {
            background-color: #666;
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #222;
        }

        .btn-primary:hover {
            background-color: #555;
        }

        .btn-danger {
            background-color: #b22222;
        }

        .btn-danger:hover {
            background-color: #e63939;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: #222;
            color: #fff;
            font-weight: bold;
        }

        td {
            background-color: #1a1a1a;
            color: #f5f5f5;
        }

        tr:hover td {
            background-color: #333;
        }

        /* Edit/Delete buttons side by side */
        .table-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px; /* space between buttons */
        }

        .table-actions a {
            flex: none; /* don't stretch */
            min-width: auto;
            padding: 5px 10px;
        }

        /* Responsive for mobile */
        @media (max-width: 768px) {
            .actions {
                flex-direction: column;
            }
            .table-actions {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Car List</h1>

    <div class="actions">
        <a th:href="@{/add}" class="btn btn-primary">➕ Add New Car</a>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="btn btn-danger">🚪 Logout</button>
        </form>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>License Plate</th>
            <th>Make</th>
            <th>Model</th>
            <th>Year</th>
            <th>Color</th>
            <th>Body Type</th>
            <th>Engine Type</th>
            <th>Transmission</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car : ${cars}">
            <td th:text="${car.carId}"></td>
            <td th:text="${car.licensePlateNumber}"></td>
            <td th:text="${car.make}"></td>
            <td th:text="${car.model}"></td>
            <td th:text="${car.year}"></td>
            <td th:text="${car.color}"></td>
            <td th:text="${car.bodyType}"></td>
            <td th:text="${car.engineType}"></td>
            <td th:text="${car.transmission}"></td>
            <td>
                <div class="table-actions">
                    <a th:href="@{'/edit/' + ${car.carId}}" class="btn btn-primary">✏ Edit</a>
                    <a th:href="@{/delete/{id}(id=${car.carId})}" class="btn btn-danger">🗑 Delete</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
