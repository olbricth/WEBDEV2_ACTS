<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee List</title>
    <style>
        /* === Global === */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 1000px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
        }

        /* Buttons Row */
        .actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Buttons */
        .btn, button {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            background-color: #444;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-align: center;
        }

        .btn:hover, button:hover {
            background-color: #666;
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #222;
        }

        .btn-primary:hover {
            background-color: #555;
        }

        .btn-danger {
            background-color: #b22222;
        }

        .btn-danger:hover {
            background-color: #e63939;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: #222;
            color: #fff;
            font-weight: bold;
        }

        td {
            background-color: #1a1a1a;
            color: #f5f5f5;
        }

        tr:hover td {
            background-color: #333;
        }

        /* Edit/Delete buttons side by side */
        .table-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .table-actions a {
            flex: none;
            min-width: auto;
            padding: 5px 10px;
        }

        /* Responsive for mobile */
        @media (max-width: 768px) {
            .actions {
                flex-direction: column;
            }
            .table-actions {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Employee List</h1>

    <!-- ✅ Actions -->
    <div class="actions">
        <a href="/employees/new" class="btn btn-primary">Add Employee</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger">🚪 Logout</button>
        </form>
    </div>

    <!-- ✅ Employee Table -->
    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.email}"></td>
            <td class="table-actions">
                <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-primary">✏ Edit</a>
                <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure?');">🗑 Delete</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
