
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${formTitle}">Car Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center; /* center title and link */
        }
        form {
            display: inline-block; /* allows horizontal centering */
            text-align: left;      /* keep labels and inputs aligned neatly */
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        input, select, button {
            margin: 5px 0;
            padding: 6px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            width: auto;
            display: block;
            margin: 10px auto;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>
<h1 th:text="${formTitle}">Car Form</h1>

<form th:action="@{${car.carId} != null ? '/edit/' + ${car.carId} : '/add'}" th:object="${car}" method="post">
    <input type="hidden" th:field="*{carId}" />

    License Plate: <input type="text" th:field="*{licensePlateNumber}" />
    <div th:if="${#fields.hasErrors('licensePlateNumber')}" th:errors="*{licensePlateNumber}" class="error"></div>

    Make: <input type="text" th:field="*{make}" />
    <div th:if="${#fields.hasErrors('make')}" th:errors="*{make}" class="error"></div>

    Model: <input type="text" th:field="*{model}" />
    <div th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="error"></div>

    Year: <input type="number" th:field="*{year}" />
    <div th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="error"></div>

    Color: <input type="text" th:field="*{color}" />
    <div th:if="${#fields.hasErrors('color')}" th:errors="*{color}" class="error"></div>

    Body Type:
    <select th:field="*{bodyType}">
        <option value="Sedan">Sedan</option>
        <option value="SUV">SUV</option>
        <option value="Hatchback">Hatchback</option>
    </select>

    Engine Type:
    <select th:field="*{engineType}">
        <option value="Gasoline">Gasoline</option>
        <option value="Diesel">Diesel</option>
        <option value="Electric">Electric</option>
        <option value="Hybrid">Hybrid</option>
    </select>

    Transmission:
    <select th:field="*{transmission}">
        <option value="Automatic">Automatic</option>
        <option value="Manual">Manual</option>
    </select>

    <button type="submit">Submit</button>
</form>

<a href="/">Back to list</a>

</body>
</html>
