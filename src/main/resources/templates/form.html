<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${formTitle}">Car Form</title>
    <style>
        /* === Global === */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input, select {
            padding: 12px;
            border-radius: 12px;
            border: none;
            background-color: #333;
            color: #f5f5f5;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            background-color: #444;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background-color: #444;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #666;
            transform: translateY(-2px);
        }

        .error {
            color: #ff4d4d;
            font-size: 0.9rem;
        }

        /* Navigation links */
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        a {
            text-decoration: none;
            color: #ddd;
            font-weight: bold;
            transition: color 0.2s;
        }

        a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${formTitle}">Car Form</h1>

    <form th:action="@{${car.carId} != null ? '/edit/' + ${car.carId} : '/add'}" th:object="${car}" method="post">
        <input type="hidden" th:field="*{carId}" />

        <label for="licensePlateNumber">License Plate:</label>
        <input type="text" id="licensePlateNumber" th:field="*{licensePlateNumber}" />
        <div th:if="${#fields.hasErrors('licensePlateNumber')}" th:errors="*{licensePlateNumber}" class="error"></div>

        <label for="make">Make:</label>
        <input type="text" id="make" th:field="*{make}" />
        <div th:if="${#fields.hasErrors('make')}" th:errors="*{make}" class="error"></div>

        <label for="model">Model:</label>
        <input type="text" id="model" th:field="*{model}" />
        <div th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="error"></div>

        <label for="year">Year:</label>
        <input type="number" id="year" th:field="*{year}" />
        <div th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="error"></div>

        <label for="color">Color:</label>
        <input type="text" id="color" th:field="*{color}" />
        <div th:if="${#fields.hasErrors('color')}" th:errors="*{color}" class="error"></div>

        <label for="bodyType">Body Type:</label>
        <select id="bodyType" th:field="*{bodyType}">
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Hatchback">Hatchback</option>
        </select>

        <label for="engineType">Engine Type:</label>
        <select id="engineType" th:field="*{engineType}">
            <option value="Gasoline">Gasoline</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid">Hybrid</option>
        </select>

        <label for="transmission">Transmission:</label>
        <select id="transmission" th:field="*{transmission}">
            <option value="Automatic">Automatic</option>
            <option value="Manual">Manual</option>
        </select>

        <button type="submit">Submit</button>
    </form>

    <div class="links">
        <a href="/">⬅ Back to List</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button type="submit">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
