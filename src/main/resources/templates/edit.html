<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Car</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>
<body>
<h1>Edit Car</h1>


<form th:action="@{/edit/{id}(id=${car.carId})}" th:object="${car}" method="post">


    <input type="hidden" th:field="*{carId}" />


    <label for="licensePlateNumber">License Plate Number:</label>
    <input type="text" id="licensePlateNumber" th:field="*{licensePlateNumber}" />


    <label for="make">Make:</label>
    <input type="text" id="make" th:field="*{make}" />


    <label for="model">Model:</label>
    <input type="text" id="model" th:field="*{model}" />


    <label for="year">Year:</label>
    <input type="number" id="year" th:field="*{year}" />


    <label for="color">Color:</label>
    <input type="text" id="color" th:field="*{color}" />


    <label for="bodyType">Body Type:</label>
    <input type="text" id="bodyType" th:field="*{bodyType}" />


    <label for="engineType">Engine Type:</label>
    <input type="text" id="engineType" th:field="*{engineType}" />


    <label for="transmission">Transmission:</label>
    <input type="text" id="transmission" th:field="*{transmission}" />


    <button type="submit">Save</button>
</form>


<a href="/">Back to List</a>
</body>
</html>
