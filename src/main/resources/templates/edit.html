<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Car</title>
    <style>
        /* === Global === */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 600px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        input {
            padding: 12px;
            border-radius: 12px;
            border: none;
            background-color: #333;
            color: #f5f5f5;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            background-color: #444;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background-color: #444;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #666;
            transform: translateY(-2px);
        }

        .btn-primary {
            background-color: #222;
        }

        .btn-primary:hover {
            background-color: #555;
        }

        .btn-secondary {
            background-color: #555;
        }

        .btn-secondary:hover {
            background-color: #777;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Edit Car</h1>

    <form th:action="@{/edit/{id}(id=${car.carId})}" th:object="${car}" method="post">
        <input type="hidden" th:field="*{carId}" />

        <label for="licensePlateNumber">License Plate Number:</label>
        <input type="text" id="licensePlateNumber" th:field="*{licensePlateNumber}" required />

        <label for="make">Make:</label>
        <input type="text" id="make" th:field="*{make}" required />

        <label for="model">Model:</label>
        <input type="text" id="model" th:field="*{model}" required />

        <label for="year">Year:</label>
        <input type="number" id="year" th:field="*{year}" required />

        <label for="color">Color:</label>
        <input type="text" id="color" th:field="*{color}" required />

        <label for="bodyType">Body Type:</label>
        <input type="text" id="bodyType" th:field="*{bodyType}" required />

        <label for="engineType">Engine Type:</label>
        <input type="text" id="engineType" th:field="*{engineType}" required />

        <label for="transmission">Transmission:</label>
        <input type="text" id="transmission" th:field="*{transmission}" required />

        <div class="actions">
            <button type="submit" class="btn btn-primary">💾 Save</button>
            <a href="/" class="btn btn-secondary">⬅ Back to List</a>
        </div>
    </form>
</div>
</body>
</html>
