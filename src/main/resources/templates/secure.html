<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Secure</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Keep page consistent with your global design */
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #2c2c2c;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #fff;
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            background-color: #b22222;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }

        a:hover {
            background-color: #e63939;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Secure Page</h1>
    <p th:text="'Hello, ' + ${#httpServletRequest.remoteUser}"></p>
    <a th:href="@{/logout}">Logout</a>
</div>
</body>
</html>
