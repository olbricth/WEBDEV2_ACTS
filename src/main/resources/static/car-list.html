<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Car List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#2c2c2c] text-[#f5f5f5] font-[Segoe_UI,Arial,sans-serif] p-5">

<!-- MAIN CARD -->
<main class="bg-[#111] rounded-2xl shadow-[0_0_25px_rgba(255,255,255,0.08)] p-8 max-w-[1100px] mx-auto mt-10">

    <!-- HEADER -->
    <header class="flex flex-col items-center text-center mb-6">
        <!-- Title -->
        <h1 class="text-white text-3xl font-semibold mb-4">Car List</h1>

        <!-- Buttons -->
        <div class="flex gap-3 justify-center">
            <button id="addNewBtn"
                    class="bg-[#222] hover:bg-[#555] text-white font-bold text-sm py-2 px-4 rounded-md transition-all duration-200 transform hover:-translate-y-1">
                ➕ Add New Car
            </button>

            <form id="logoutForm" class="m-0">
                <button type="submit"
                        class="bg-[#b22222] hover:bg-[#e63939] text-white font-bold text-sm py-2 px-4 rounded-md transition-all duration-200 transform hover:-translate-y-1">
                    🚪 Logout
                </button>
            </form>
        </div>
    </header>

    <!-- TABLE WRAPPER (moved INSIDE main for alignment) -->
    <div class="overflow-x-auto rounded-lg border border-[#1b1b1b]">
        <table class="w-full min-w-[900px] table-auto text-left">
            <thead class="bg-[#222] text-white">
            <tr>
                <th class="py-3 px-4 font-bold">ID</th>
                <th class="py-3 px-4 font-bold">License Plate</th>
                <th class="py-3 px-4 font-bold">Make</th>
                <th class="py-3 px-4 font-bold">Model</th>
                <th class="py-3 px-4 font-bold">Year</th>
                <th class="py-3 px-4 font-bold">Color</th>
                <th class="py-3 px-4 font-bold">Body Type</th>
                <th class="py-3 px-4 font-bold">Engine Type</th>
                <th class="py-3 px-4 font-bold">Transmission</th>
                <th class="py-3 px-4 font-bold text-center">Actions</th>
            </tr>
            </thead>
            <tbody id="carTableBody" class="bg-[#0f0f0f]">
            <!-- rows injected by js -->
            </tbody>
        </table>
    </div>
</main>

<!-- MODAL BACKDROP (hidden by default) -->
<div id="modalBackdrop"
     class="hidden fixed inset-0 bg-black/60 z-[999] items-center justify-center px-4">
    <div class="bg-[#111] text-[#f5f5f5] rounded-xl w-[420px] max-w-[95%] p-6 shadow-2xl">
        <h2 id="modalTitle" class="text-xl mb-3 font-semibold text-white">Add Car</h2>

        <form id="carForm" novalidate>
            <input type="hidden" id="carId">

            <div class="mb-3">
                <label for="licensePlateNumber" class="block text-sm mb-1 text-gray-300">License Plate</label>
                <input id="licensePlateNumber" name="licensePlateNumber"
                       class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2">
                <div id="error-licensePlateNumber" class="text-red-400 text-sm mt-1 hidden">License plate is required.</div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="make" class="block text-sm mb-1 text-gray-300">Make</label>
                    <input id="make" name="make" class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2">
                    <div id="error-make" class="text-red-400 text-sm mt-1 hidden">Make is required.</div>
                </div>
                <div>
                    <label for="model" class="block text-sm mb-1 text-gray-300">Model</label>
                    <input id="model" name="model" class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2">
                    <div id="error-model" class="text-red-400 text-sm mt-1 hidden">Model is required.</div>
                </div>
            </div>

            <div class="mt-3 grid grid-cols-2 gap-3">
                <div>
                    <label for="year" class="block text-sm mb-1 text-gray-300">Year</label>
                    <input id="year" name="year" type="number" class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2">
                    <div id="error-year" class="text-red-400 text-sm mt-1 hidden">Enter a valid year (1990–2025).</div>
                </div>
                <div>
                    <label for="color" class="block text-sm mb-1 text-gray-300">Color</label>
                    <input id="color" name="color" class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2">
                    <div id="error-color" class="text-red-400 text-sm mt-1 hidden">Color is required.</div>
                </div>
            </div>

            <div class="mt-3">
                <label for="bodyType" class="block text-sm mb-1 text-gray-300">Body Type</label>
                <select id="bodyType" name="bodyType" class="w-full bg-[#1a1a1a] border border-[#333] rounded-md px-3 py-2">
                    <option value="">Select Body Type</option>
                    <option>Sedan</option><option>SUV</option><option>Truck</option><option>Coupe</option><option>Hatchback</option><option>Convertible</option>
                </select>
                <div id="error-bodyType" class="text-red-400 text-sm mt-1 hidden">Body type is required.</div>
            </div>

            <div class="mt-3">
                <label for="engineType" class="block text-sm mb-1 text-gray-300">Engine Type</label>
                <select id="engineType" name="engineType" class="w-full bg-[#1a1a1a] border border-[#333] rounded-md px-3 py-2">
                    <option value="">Select Engine Type</option>
                    <option>Gasoline</option><option>Diesel</option><option>Electric</option><option>Hybrid</option>
                </select>
                <div id="error-engineType" class="text-red-400 text-sm mt-1 hidden">Engine type is required.</div>
            </div>

            <div class="mt-3">
                <label for="transmission" class="block text-sm mb-1 text-gray-300">Transmission</label>
                <select id="transmission" name="transmission" class="w-full bg-[#1a1a1a] border border-[#333] rounded-md px-3 py-2">
                    <option value="">Select Transmission</option><option>Automatic</option><option>Manual</option><option>CVT</option>
                </select>
                <div id="error-transmission" class="text-red-400 text-sm mt-1 hidden">Transmission is required.</div>
            </div>

            <div class="flex justify-end gap-3 mt-4">
                <button type="button" id="cancelBtn" class="bg-[#333] text-white py-2 px-4 rounded-md hover:bg-[#555] transition-all duration-200">Cancel</button>
                <button type="submit" id="saveBtn" class="bg-[#222] text-white py-2 px-4 rounded-md hover:bg-[#555] transition-all duration-200">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
