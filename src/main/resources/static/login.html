<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#2c2c2c] text-[#f5f5f5] font-[Segoe_UI,Arial,sans-serif] flex items-center justify-center min-h-screen">

<div class="bg-[#111] rounded-2xl shadow-[0_0_25px_rgba(255,255,255,0.08)] p-8 w-full max-w-[420px]">
    <h1 class="text-center text-white text-3xl mb-6 font-semibold" id="formTitle">Welcome</h1>
    <p class="text-center text-gray-400 mb-6 text-sm" id="formSubtitle">Sign in to continue</p>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="space-y-4">
        <div>
            <label for="loginUsername" class="block text-sm text-gray-300 mb-1">Username</label>
            <input id="loginUsername" type="text" placeholder="Enter your username"
                   class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
            <label for="loginPassword" class="block text-sm text-gray-300 mb-1">Password</label>
            <input id="loginPassword" type="password" placeholder="Enter your password"
                   class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <p id="loginError" class="text-red-400 text-sm text-center hidden"></p>

        <button id="loginBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-2 rounded-md transition-all duration-200">
            Login
        </button>

        <p class="text-center text-sm text-gray-400 mt-4">
            Don’t have an account?
            <a href="#" id="showRegister" class="text-blue-400 hover:underline">Register</a>
        </p>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" class="space-y-4 hidden">
        <div>
            <label for="regUsername" class="block text-sm text-gray-300 mb-1">Username</label>
            <input id="regUsername" type="text" placeholder="Choose a username"
                   class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        <div>
            <label for="regPassword" class="block text-sm text-gray-300 mb-1">Password</label>
            <input id="regPassword" type="password" placeholder="Choose a password"
                   class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        <div>
            <label for="regConfirm" class="block text-sm text-gray-300 mb-1">Confirm Password</label>
            <input id="regConfirm" type="password" placeholder="Re-enter password"
                   class="w-full bg-[#1a1a1a] text-[#f5f5f5] border border-[#333] rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <p id="registerError" class="text-red-400 text-sm text-center hidden"></p>
        <p id="registerSuccess" class="text-green-400 text-sm text-center hidden"></p>

        <button id="registerBtn"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold text-sm py-2 rounded-md transition-all duration-200">
            Register
        </button>

        <p class="text-center text-sm text-gray-400 mt-4">
            Already have an account?
            <a href="#" id="showLogin" class="text-blue-400 hover:underline">Login</a>
        </p>
    </div>
</div>

<script>
    // Redirect if already logged in
    // const token = localStorage.getItem('token');
    // if (token) {
    //   window.location.href = "car-list.html";
    // }

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");

    // Toggle forms
    document.getElementById("showRegister").addEventListener("click", (e) => {
      e.preventDefault();
      loginForm.classList.add("hidden");
      registerForm.classList.remove("hidden");
      formTitle.textContent = "Create Account";
      formSubtitle.textContent = "Sign up to start using Car List";
    });

    document.getElementById("showLogin").addEventListener("click", (e) => {
      e.preventDefault();
      registerForm.classList.add("hidden");
      loginForm.classList.remove("hidden");
      formTitle.textContent = "Welcome";
      formSubtitle.textContent = "Sign in to continue";
    });

    // LOGIN
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      const error = document.getElementById("loginError");
      error.classList.add("hidden");

      if (!username || !password) {
        error.textContent = "Please fill in all fields.";
        error.classList.remove("hidden");
        return;
      }

      try {
        const res = await fetch("http://localhost:8080/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.message || "Login failed");
        }

        const data = await res.json();
        localStorage.setItem("token", data.token);
        localStorage.setItem("username", data.username);
        localStorage.setItem("role", data.role);

        window.location.href = "car-list.html";
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove("hidden");
      }
    });

    // REGISTER
    document.getElementById("registerBtn").addEventListener("click", async () => {
      const username = document.getElementById("regUsername").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      const confirm = document.getElementById("regConfirm").value.trim();
      const error = document.getElementById("registerError");
      const success = document.getElementById("registerSuccess");

      error.classList.add("hidden");
      success.classList.add("hidden");

      if (!username || !password || !confirm) {
        error.textContent = "Please fill in all fields.";
        error.classList.remove("hidden");
        return;
      }
      if (password !== confirm) {
        error.textContent = "Passwords do not match.";
        error.classList.remove("hidden");
        return;
      }

      try {
        const res = await fetch("http://localhost:8080/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.message || "Registration failed");
        }

        success.textContent = "Account created successfully! You can now log in.";
        success.classList.remove("hidden");

        setTimeout(() => {
          document.getElementById("showLogin").click();
        }, 2000);

      } catch (err) {
        error.textContent = err.message;
        error.classList.remove("hidden");
      }
    });
</script>
</body>
</html>
